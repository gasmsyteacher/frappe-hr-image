# ERPNext v16 + Frappe HR on Coolify -- site hr.virtualmindshub.app
#
# Adapted from frappe_docker's pwd.yml (at a0c5213) for Coolify:
# - one custom image with erpnext + hrms (ghcr.io/gasmsyteacher/frappe-hr), pinned by version tag
# - the site is named after the real hostname, and nginx selects it by that fixed name
# - passwords are Coolify-generated (SERVICE_PASSWORD_*), never "admin"
# - no host port: Traefik routes hr.virtualmindshub.app to frontend:8080
# - configurator and create-site run once and exit; they are restart 'no' and
#   exclude_from_hc so their normal exit does not mark the service degraded
# - no custom networks: Coolify's own network is what Traefik can reach
# - no `bench build` at deploy time: the image already carries built assets
#
# Upgrade: change the image tag on every frappe-hr service and redeploy. create-site
# then runs `bench migrate` on the existing site instead of creating one.

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      - MARIADB_ROOT_PASSWORD=${SERVICE_PASSWORD_DBROOT}
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_DBROOT}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  configurator:
    image: ghcr.io/gasmsyteacher/frappe-hr:erpnext-v16.34.2-hrms-v16.18.1
    restart: 'no'
    exclude_from_hc: true
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - >
        set -e;
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        echo "configurator done";
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
      - SOCKETIO_PORT=9000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: ghcr.io/gasmsyteacher/frappe-hr:erpnext-v16.34.2-hrms-v16.18.1
    restart: 'no'
    exclude_from_hc: true
    depends_on:
      configurator:
        condition: service_completed_successfully
    entrypoint: ["bash", "-c"]
    # Keep each shell statement on ONE line. In a folded (>) block, lines indented
    # deeper than the first keep their line breaks, so flags wrapped onto their own
    # lines reach bash as separate commands: `bench new-site` would run with no
    # arguments and `--admin-password=...` would run as a command.
    command:
      - >
        set -e;
        wait-for-it -t 180 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "site $$SITE_NAME exists: migrating";
          bench --site "$$SITE_NAME" migrate;
        else
          echo "creating site $$SITE_NAME with erpnext + hrms";
          bench new-site "$$SITE_NAME" --mariadb-user-host-login-scope='%' --db-root-username=root --db-root-password="$$DB_ROOT_PASSWORD" --admin-password="$$ADMIN_PASSWORD" --install-app erpnext --install-app hrms --set-default;
        fi;
        bench --site "$$SITE_NAME" set-config host_name "https://$$SITE_NAME";
        bench --site "$$SITE_NAME" list-apps;
        echo "create-site done";
    environment:
      - SITE_NAME=hr.virtualmindshub.app
      - DB_ROOT_PASSWORD=${SERVICE_PASSWORD_DBROOT}
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  backend:
    image: ghcr.io/gasmsyteacher/frappe-hr:erpnext-v16.34.2-hrms-v16.18.1
    restart: unless-stopped
    depends_on:
      create-site:
        condition: service_completed_successfully
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  websocket:
    image: ghcr.io/gasmsyteacher/frappe-hr:erpnext-v16.34.2-hrms-v16.18.1
    restart: unless-stopped
    depends_on:
      create-site:
        condition: service_completed_successfully
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      - FRAPPE_REDIS_CACHE=redis://redis-cache:6379
      - FRAPPE_REDIS_QUEUE=redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ghcr.io/gasmsyteacher/frappe-hr:erpnext-v16.34.2-hrms-v16.18.1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started
    command: ["nginx-entrypoint.sh"]
    environment:
      - SERVICE_FQDN_FRONTEND_8080
      - BACKEND=backend:8000
      - SOCKETIO=websocket:9000
      # a fixed site name, not $host: requests arriving with any other Host
      # (internal probes, a second domain) still reach the one site
      - FRAPPE_SITE_NAME_HEADER=hr.virtualmindshub.app
      # Traefik reaches the container from Coolify's docker network
      - UPSTREAM_REAL_IP_ADDRESS=10.0.0.0/8
      - UPSTREAM_REAL_IP_HEADER=X-Forwarded-For
      - UPSTREAM_REAL_IP_RECURSIVE=off
      - PROXY_READ_TIMEOUT=120
      - CLIENT_MAX_BODY_SIZE=50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  queue-short:
    image: ghcr.io/gasmsyteacher/frappe-hr:erpnext-v16.34.2-hrms-v16.18.1
    restart: unless-stopped
    depends_on:
      create-site:
        condition: service_completed_successfully
    command: ["bench", "worker", "--queue", "short,default"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  queue-long:
    image: ghcr.io/gasmsyteacher/frappe-hr:erpnext-v16.34.2-hrms-v16.18.1
    restart: unless-stopped
    depends_on:
      create-site:
        condition: service_completed_successfully
    command: ["bench", "worker", "--queue", "long,default,short"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  scheduler:
    image: ghcr.io/gasmsyteacher/frappe-hr:erpnext-v16.34.2-hrms-v16.18.1
    restart: unless-stopped
    depends_on:
      create-site:
        condition: service_completed_successfully
    command: ["bench", "schedule"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:
  sites:
  logs:
