name: build image

# Frappe v16 + ERPNext + Frappe HR, built with frappe_docker's layered
# Containerfile. apps.json pins the app versions; this workflow pins the
# frappe_docker build context.
#
# FRAPPE_BRANCH must stay a branch name (version-16), not a tag: the layered
# Containerfile uses it as the tag of frappe/build and frappe/base too, and
# frappe/build publishes no per-release tags (frappe/build:v16.33.1 -> 404).

on:
  push:
    branches: [main]
    paths: [apps.json, .github/workflows/build.yml]
  workflow_dispatch:

concurrency:
  group: build-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gasmsyteacher/frappe-hr
  FRAPPE_BRANCH: version-16
  FRAPPE_DOCKER_REF: a0c52135d4d41c4b8acf7adfdfc5bbcba46dd4d0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}
          path: frappe_docker

      - name: Derive version tag from apps.json
        id: ver
        # jq, not an inline python f-string: escaped quotes inside an f-string
        # expression are a SyntaxError before Python 3.12, which broke the first run.
        run: |
          erpnext=$(jq -er '.[] | select(.url | endswith("/erpnext")) | .branch' apps.json)
          hrms=$(jq -er '.[] | select(.url | endswith("/hrms")) | .branch' apps.json)
          tag="erpnext-${erpnext}-hrms-${hrms}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version tag: $tag"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          platforms: linux/amd64
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
          # a BuildKit secret, never a build arg: build args are visible in image history
          secret-files: |
            apps_json=apps.json
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:v16
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        run: |
          docker run --rm --entrypoint bash "$IMAGE:sha-${GITHUB_SHA}" -c '
            set -e
            cd /home/frappe/frappe-bench
            test -d apps/frappe && test -d apps/erpnext && test -d apps/hrms
            for c in bench node nginx-entrypoint.sh wait-for-it jq; do printf "%-22s %s\n" "$c" "$(command -v $c)"; done
            for a in frappe erpnext hrms; do
              printf "%-8s %s\n" "$a" "$(python -c "import $a; print($a.__version__)" 2>/dev/null || env/bin/python -c "import $a; print($a.__version__)")"
            done
            test -f sites/assets/hrms/dist/.gitkeep -o -d sites/assets/hrms || ls sites/assets | head
          '
